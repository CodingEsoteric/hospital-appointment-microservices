
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-service
          image: hospital-appointment-microservices-appointment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: APPOINTMENT_DATABASE_URL
              value: "jdbc:sqlite:/data/appointment-service.db"
            - name: PATIENT_SERVICE_URL
              value: "http://patient-service:8082"
            - name: AVAILABILITY_SERVICE_URL
              value: "http://availability-service:8083"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8084"
            - name: NOTIFICATION_SEND_PATH
              value: "/api/notifications"
          volumeMounts:
            - name: appointment-data
              mountPath: /data
      volumes:
        - name: appointment-data
          persistentVolumeClaim:
            claimName: appointment-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appointment-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
spec:
  selector:
    app: appointment-service
  ports:
    - port: 8081
      targetPort: 8081
  type: NodePort
