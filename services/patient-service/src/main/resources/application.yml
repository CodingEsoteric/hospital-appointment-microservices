server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: patient-service
  datasource:
    url: ${PATIENT_DATABASE_URL:jdbc:sqlite:./patient-service.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
